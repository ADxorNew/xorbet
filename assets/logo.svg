<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="xorbet logo">
  <title>xorbet</title>
  <defs>
    <pattern id="waffle" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 5 H10 M5 0 V10" stroke="#A86B2D" stroke-width="2" opacity="0.7"/>
